# Protocol: minor and patch updates arrive as at most three grouped PRs a week and
# merge themselves once CI passes (see workflows/dependabot-auto-merge.yml).
# Majors arrive one per PR and are never auto-merged: a human migrates them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # zod 4 breaks every generateObject schema; migrate on purpose, not by bump
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # @ai-sdk/* 4.x needs ai 7; bump them together by hand
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]
      # typescript-eslint caps TypeScript below 6.1
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # mcp-handler 1.x pins the SDK to 1.26.0 exactly
      - dependency-name: "@modelcontextprotocol/sdk"
      # Sentry 11 drops the named withSentryConfig export; migrate next.config by hand
      - dependency-name: "@sentry/nextjs"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
