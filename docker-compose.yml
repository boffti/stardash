name: stardash

services:
  stardash:
    image: ghcr.io/boffti/stardash:latest
    # To build from source instead: comment `image`, uncomment `build`.
    # build: .
    ports:
      - "3000:3000"
    volumes:
      - stardash-data:/data
    environment:
      # Optional. Enables the in-app AI features (categorize, intel, briefs, Discover).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional. Public origin if a reverse proxy does not send X-Forwarded-Host/Proto.
      APP_URL: ${APP_URL:-}
    restart: unless-stopped

volumes:
  stardash-data:
